<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayyan Saddique Scientific Calculator</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  padding: 5px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #141e30, #243b55);
}

.calculator {
  width: min(90vw, 350px);
  max-height: 96vh;
  overflow-y: auto;
  padding: 8px;
  border-radius: 15px;
  background: #20242b;
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

h1 {
  margin: 0 0 5px;
  text-align: center;
  font-size: 15px;
  color: white;
}

.display {
  width: 100%;
  height: 50px;
  margin-bottom: 6px;
  padding: 5px 8px;
  border: none;
  border-radius: 8px;
  background: #101318;
  color: white;
  text-align: right;
  font-size: 21px;
  outline: none;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}

button {
  height: 38px;
  border: none;
  border-radius: 7px;
  background: #343a46;
  color: white;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #4b5563;
}

.operator {
  background: #46566d;
}

.equal {
  background: #1976d2;
}

.clear {
  background: #c62828;
}

.history-btn {
  grid-column: span 4;
  background: #6a1b9a;
}

.history {
  display: none;
  margin-top: 5px;
  padding: 6px;
  border-radius: 8px;
  background: #11151a;
  color: white;
  max-height: 100px;
  overflow-y: auto;
  font-size: 11px;
}

.history.show {
  display: block;
}

.history-item {
  padding: 4px;
  border-bottom: 1px solid #333;
  word-break: break-word;
}

.clear-history {
  width: 100%;
  height: 28px;
  margin-top: 5px;
  background: #555;
  font-size: 11px;
}

@media (max-width: 320px) {
  .calculator {
    width: 96vw;
    padding: 6px;
  }

  button {
    height: 35px;
    font-size: 11px;
  }

  .display {
    height: 46px;
    font-size: 19px;
  }

  h1 {
    font-size: 14px;
  }
}

@media (max-height: 600px) {
  .calculator {
    max-height: 98vh;
    padding: 5px;
  }

  button {
    height: 32px;
  }

  .display {
    height: 42px;
  }

  h1 {
    font-size: 13px;
    margin-bottom: 3px;
  }
}
</style>
</head>

<body>

<div class="calculator">

<h1>🔬 Rayyan Saddique Scientific Calculator</h1>

<input type="text" id="display" class="display" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">AC</button>
<button onclick="backspace()">⌫</button>
<button onclick="add('(')">(</button>
<button onclick="add(')')">)</button>

<button onclick="add('sin(')">sin</button>
<button onclick="add('cos(')">cos</button>
<button onclick="add('tan(')">tan</button>
<button onclick="add('√(')">√</button>

<button onclick="add('log(')">log</button>
<button onclick="add('ln(')">ln</button>
<button onclick="add('π')">π</button>
<button onclick="add('^')">xʸ</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('-')">−</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="add('%')">%</button>
<button class="operator" onclick="add('+')">+</button>

<button onclick="add('!')">x!</button>
<button onclick="add('10^')">10ˣ</button>
<button onclick="add('e')">e</button>
<button class="equal" onclick="calculate()">=</button>

<button class="history-btn" onclick="toggleHistory()">📜 History</button>

</div>

<div id="history" class="history"></div>

</div>

<script>
const display = document.getElementById("display");
const historyBox = document.getElementById("history");

function add(value) {
  if (display.value === "Error") {
    display.value = "";
  }
  display.value += value;
}

function clearDisplay() {
  display.value = "";
}

function backspace() {
  display.value = display.value.slice(0, -1);
}

function factorial(n) {
  if (n < 0 || !Number.isInteger(n)) {
    throw new Error("Invalid factorial");
  }

  let result = 1;

  for (let i = 2; i <= n; i++) {
    result *= i;
  }

  return result;
}

function calculate() {
  let expression = display.value;

  if (!expression) return;

  try {
    const original = expression;

    expression = expression
      .replace(/π/g, "Math.PI")
      .replace(/\be\b/g, "Math.E")
      .replace(/√\(/g, "Math.sqrt(")
      .replace(/log\(/g, "Math.log10(")
      .replace(/ln\(/g, "Math.log(")
      .replace(/sin\(/g, "sinDeg(")
      .replace(/cos\(/g, "cosDeg(")
      .replace(/tan\(/g, "tanDeg(")
      .replace(/\^/g, "**")
      .replace(/(\d+(?:\.\d+)?)%/g, "($1/100)");

    expression = expression.replace(
      /(\d+(?:\.\d+)?)!/g,
      "factorial($1)"
    );

    const result = Function(
      "sinDeg",
      "cosDeg",
      "tanDeg",
      "factorial",
      "return " + expression
    )(
      x => Math.sin(x * Math.PI / 180),
      x => Math.cos(x * Math.PI / 180),
      x => Math.tan(x * Math.PI / 180),
      factorial
    );

    if (!Number.isFinite(result)) {
      throw new Error("Invalid result");
    }

    display.value = Number.isInteger(result)
      ? result
      : Number(result.toFixed(10));

    saveHistory(original + " = " + display.value);

  } catch (error) {
    display.value = "Error";
  }
}

function saveHistory(item) {
  let history = JSON.parse(
    localStorage.getItem("calculatorHistory") || "[]"
  );

  history.unshift(item);

  if (history.length > 20) {
    history = history.slice(0, 20);
  }

  localStorage.setItem(
    "calculatorHistory",
    JSON.stringify(history)
  );

  showHistory();
}

function showHistory() {
  const history = JSON.parse(
    localStorage.getItem("calculatorHistory") || "[]"
  );

  if (history.length === 0) {
    historyBox.innerHTML = "No history yet.";
    return;
  }

  historyBox.innerHTML =
    history.map(item =>
      `<div class="history-item">${item}</div>`
    ).join("") +
    `<button class="clear-history" onclick="clearHistory()">
      Clear History
    </button>`;
}

function toggleHistory() {
  historyBox.classList.toggle("show");
  showHistory();
}

function clearHistory() {
  localStorage.removeItem("calculatorHistory");
  showHistory();
}

showHistory();
</script>

</body>
</html>
