```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayyan Scientific Calculator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:20px;
}

.calculator{
    width:100%;
    max-width:420px;
    background:#171717;
    padding:20px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    color:white;
    font-size:25px;
    margin-bottom:15px;
}

.display{
    width:100%;
    height:85px;
    background:#252525;
    border:none;
    border-radius:15px;
    color:white;
    font-size:32px;
    text-align:right;
    padding:15px;
    margin-bottom:15px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:58px;
    border:none;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:#333;
    color:white;
    transition:.15s;
}

button:hover{
    transform:scale(1.04);
    background:#444;
}

.operator{
    background:#f39c12;
}

.equal{
    background:#27ae60;
}

.clear{
    background:#e74c3c;
}

.scientific{
    background:#2980b9;
}

.zero{
    grid-column:span 2;
}
</style>
</head>

<body>

<div class="calculator">

<h1>🔬 Rayyan Scientific Calculator</h1>

<input id="display" class="display" type="text" value="0" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="deleteLast()">DEL</button>
<button class="scientific" onclick="addValue('(')">(</button>
<button class="scientific" onclick="addValue(')')">)</button>

<button class="scientific" onclick="addValue('Math.sin(')">sin</button>
<button class="scientific" onclick="addValue('Math.cos(')">cos</button>
<button class="scientific" onclick="addValue('Math.tan(')">tan</button>
<button class="scientific" onclick="addValue('Math.sqrt(')">√</button>

<button class="scientific" onclick="addValue('Math.log10(')">log</button>
<button class="scientific" onclick="addValue('Math.log(')">ln</button>
<button class="scientific" onclick="addValue('Math.PI')">π</button>
<button class="scientific" onclick="addValue('**')">xʸ</button>

<button onclick="addValue('7')">7</button>
<button onclick="addValue('8')">8</button>
<button onclick="addValue('9')">9</button>
<button class="operator" onclick="addValue('/')">÷</button>

<button onclick="addValue('4')">4</button>
<button onclick="addValue('5')">5</button>
<button onclick="addValue('6')">6</button>
<button class="operator" onclick="addValue('*')">×</button>

<button onclick="addValue('1')">1</button>
<button onclick="addValue('2')">2</button>
<button onclick="addValue('3')">3</button>
<button class="operator" onclick="addValue('-')">−</button>

<button class="zero" onclick="addValue('0')">0</button>
<button onclick="addValue('.')">.</button>
<button class="operator" onclick="addValue('+')">+</button>

<button class="equal" style="grid-column:span 4" onclick="calculate()">=</button>

</div>
</div>

<script>

const display = document.getElementById("display");

function addValue(value){

    if(display.value === "0"){
        display.value = value;
    }else{
        display.value += value;
    }
}

function clearDisplay(){
    display.value = "0";
}

function deleteLast(){

    if(display.value.length <= 1){
        display.value = "0";
    }else{
        display.value = display.value.slice(0,-1);
    }
}

function calculate(){

    try{

        let expression = display.value;

        let result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if(!isFinite(result)){
            throw new Error();
        }

        display.value = Number(result.toFixed(10));

    }catch(error){

        display.value = "Error";

        setTimeout(()=>{
            display.value = "0";
        },1200);
    }
}

</script>

</body>
</html>
