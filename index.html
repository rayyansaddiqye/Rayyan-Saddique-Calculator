<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayyan Saddique Scientific Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);

button:hover {
    background: #444;

<body>

<div class="calculator">

<div class="title">
Rayyan Saddique Scientific Calculator
</div>

<input id="display" value="0" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">AC</button>
<button onclick="deleteLast()">DEL</button>
<button onclick="percent()">%</button>
<button class="operator" onclick="press('/')">÷</button>

<button onclick="press('sin(')">sin</button>
<button onclick="press('cos(')">cos</button>
<button onclick="press('tan(')">tan</button>
<button class="operator" onclick="press('*')">×</button>

<button onclick="press('log(')">log</button>
<button onclick="press('sqrt(')">√</button>
<button onclick="press('^')">xʸ</button>
<button class="operator" onclick="press('-')">−</button>

<button onclick="press('(')">(</button>
<button onclick="press(')')">)</button>
<button onclick="press('Math.PI')">π</button>
<button class="operator" onclick="press('+')">+</button>

<button onclick="press('7')">7</button>
<button onclick="press('8')">8</button>
<button onclick="press('9')">9</button>
<button onclick="press('Math.E')">e</button>

<button onclick="press('4')">4</button>
<button onclick="press('5')">5</button>
<button onclick="press('6')">6</button>
<button onclick="press('!')">x!</button>

<button onclick="press('1')">1</button>
<button onclick="press('2')">2</button>
<button onclick="press('3')">3</button>
<button class="history-btn" onclick="toggleHistory()">History</button>

<button onclick="press('0')">0</button>
<button onclick="press('.')">.</button>
<button onclick="clearHistory()">Clear</button>
<button class="equal" onclick="calculate()">=</button>

</div>

<div id="historyBox">

<h2>Calculation History</h2>

<div id="historyList">
<div class="empty">No history yet</div>
</div>

</div>

<div class="footer">
© 2026 Rayyan Saddique
</div>

</div>

<script>

let display = document.getElementById("display");

function press(value) {

    if (display.value === "0") {
        display.value = value;
    } else {
        display.value += value;
    }
}

function clearDisplay() {
    display.value = "0";
}

function deleteLast() {

    if (display.value.length <= 1) {
        display.value = "0";
    } else {
        display.value =
            display.value.slice(0, -1);
    }
}

function percent() {

    try {
        let value = parseFloat(display.value);
        display.value = value / 100;
    } catch {
        display.value = "Error";
    }
}

function factorial(n) {

    if (n < 0 || !Number.isInteger(n)) {
        throw new Error();
    }

    let answer = 1;

    for (let i = 2; i <= n; i++) {
        answer *= i;
    }

    return answer;
}

function calculate() {

    let original = display.value;

    try {

        let expression = original;

        expression = expression.replace(
            /(\d+)!/g,
            "factorial($1)"
        );

        expression = expression.replace(
            /sqrt\(/g,
            "Math.sqrt("
        );

        expression = expression.replace(
            /log\(/g,
            "Math.log10("
        );

        expression = expression.replace(
            /\^/g,
            "**"
        );

        expression = expression.replace(
            /sin\(/g,
            "Math.sin("
        );

        expression = expression.replace(
            /cos\(/g,
            "Math.cos("
        );

        expression = expression.replace(
            /tan\(/g,
            "Math.tan("
        );

        let result = Function(
            "factorial",
            "return " + expression
        )(factorial);

        if (!isFinite(result)) {
            throw new Error();
        }

        result = Number(result.toFixed(10));

        display.value = result;

        addHistory(original, result);

    } catch {

        display.value = "Error";

        setTimeout(function() {
            display.value = "0";
        }, 1000);
    }
}


/* HISTORY */

function addHistory(expression, result) {

    let history =
        JSON.parse(
            localStorage.getItem("rayyanCalculatorHistory")
        ) || [];

    history.unshift({
        expression: expression,
        result: result,
        date: new Date().toLocaleString()
    });

    history = history.slice(0, 50);

    localStorage.setItem(
        "rayyanCalculatorHistory",
        JSON.stringify(history)
    );

    displayHistory();
}


function displayHistory() {

    let list =
        document.getElementById("historyList");

    let history =
        JSON.parse(
            localStorage.getItem("rayyanCalculatorHistory")
        ) || [];

    if (history.length === 0) {

        list.innerHTML =
            '<div class="empty">No history yet</div>';

        return;
    }

    list.innerHTML = "";

    history.forEach(function(item) {

        let div =
            document.createElement("div");

        div.className = "history-item";

        div.innerHTML =
            "<strong>" +
            item.expression +
            " = " +
            item.result +
            "</strong><br>" +
            "<small>" +
            item.date +
            "</small>";

        div.onclick = function() {
            display.value = item.result;
        };

        list.appendChild(div);
    });
}


function toggleHistory() {

    let box =
        document.getElementById("historyBox");

    if (box.style.display === "block") {

        box.style.display = "none";

    } else {

        box.style.display = "block";

        displayHistory();
    }
}


function clearHistory() {

    localStorage.removeItem(
        "rayyanCalculatorHistory"
    );

    displayHistory();
}


/* KEYBOARD */

document.addEventListener("keydown", function(event) {

    let key = event.key;

    if (
        "0123456789.+-*/()^".includes(key)
    ) {
        press(key);
    }

    if (key === "Enter") {
        calculate();
    }

    if (key === "Backspace") {
        deleteLast();
    }

    if (key === "Escape") {
        clearDisplay();
    }
});


displayHistory();

</script>

</body>
</html>
